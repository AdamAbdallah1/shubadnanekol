<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شو بدنا ناكل - Shu Badna Nekol</title>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="app-header">
        <div class="logo-container" onclick="navigateTo('home')">
            <i class="fa-solid fa-utensils logo-icon"></i>
            <span class="logo-text">SHU BADNA NEKOL</span>
        </div>
        <button class="admin-btn" id="adminHeaderBtn" onclick="navigateTo('admin')" title="لوحة التحكم">
            <i class="fa-solid fa-user-gear"></i>
        </button>
    </header>

    <!-- Main Container -->
    <main class="app-container">

        <!-- Page: Home -->
        <section id="page-home" class="page active">
            <div class="hero-banner">
                <h2>دليلك الأول للمطاعم التي تحبها</h2>
                <!-- تم إيقاف الاقتراح والتعبئة التلقائية لعدم ظهور اسم المستخدم تلقائياً -->
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" autocomplete="off" name="search_query" placeholder="ابحث عن قسم أو مطعم..." oninput="handleSearch()">
                </div>
            </div>

            <!-- Categories Section -->
            <div class="section-title">
                <h3>شو عبالك اليوم؟</h3>
            </div>
            <div class="categories-grid" id="categoriesGrid">
                <!-- Dynamic categories loaded via JS -->
            </div>

            <!-- All/Filtered Restaurants Section -->
            <div class="section-title" id="restaurantsSectionTitle">
                <h3>جميع المطاعم</h3>
            </div>
            <div class="restaurants-grid" id="restaurantsGrid">
                <!-- Dynamic restaurants loaded via JS -->
            </div>
        </section>

        <!-- Page: Category Details -->
        <section id="page-category" class="page">
            <div class="page-header-nav">
                <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-right"></i></button>
                <h2 id="categoryPageTitle">المطاعم</h2>
            </div>
            <div class="restaurants-grid" id="categoryRestaurantsGrid">
                <!-- Dynamic category restaurants loaded via JS -->
            </div>
        </section>

        <!-- Page: Restaurant Details -->
        <section id="page-restaurant" class="page">
            <div class="restaurant-detail-container" id="restaurantDetailContent">
                <!-- Dynamic content loaded via JS -->
            </div>
        </section>

        <!-- Page: Admin Login / Dashboard -->
        <section id="page-admin" class="page">
            <div class="admin-container" id="adminContainer">
                <!-- Dynamic Admin views (Login / Dashboard) loaded via JS -->
            </div>
        </section>

    </main>

    <!-- Image Modal Lightbox -->
    <div id="imageModal" class="image-modal" onclick="closeImageModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <!-- Firebase Scripts (v9+ Modular via CDN or Compat depending on script.js) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
